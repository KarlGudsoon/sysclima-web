<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/tailwind.css" />
    <link rel="preload" href="../css/tailwind.css" as="style" />
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon" />
    <link rel="icon" href="../favicon.ico" type="image/x-icon" />
    <title>SyS Climatización</title>
  </head>
  <body class="flex h-screen bg-[#e6e6e6]">
    <main class="relative m-4 flex flex-1 flex-col gap-4 overflow-y-auto rounded-lg bg-white p-8 shadow-[0_0_1rem_rgba(0,0,0,0.1)] md:flex-row">
      <div class="flex flex-1 flex-col gap-4">
        <div id="info-usuario">
          <h1 class="text-2xl font-bold">Bienvenido al dashboard</h1>
          <p class="mt-2">
            Email: <span id="user-email" class="font-semibold"></span>
          </p>
          <p>Rol: <span id="user-rol" class="font-semibold"></span></p>
          <p id="nav-username" class="mt-2 text-sm text-gray-500"></p>
          <button
            id="btn-logout"
            class="mt-4 cursor-pointer rounded-2xl border border-secondary bg-transparent px-4 py-2 text-secondary transition duration-200 hover:bg-secondary hover:text-white"
          >
            Cerrar sesión
          </button>
        </div>
      </div>
      <div class="max-w-[600px] flex-1 overflow-auto rounded-lg bg-black/5 p-4">
        <h2 class="text-lg font-bold">Formulario de contacto</h2>
        <p class="mb-4">Aquí puedes gestionar los mensajes de contacto.</p>
        <div id="lista-mensajes"></div>
      </div>
    </main>

    <script src="dashboard.js"></script>
  </body>
</html>
