<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/tailwind.css" />
    <link rel="preload" href="../css/tailwind.css" as="style" />
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon" />
    <link rel="icon" href="../favicon.ico" type="image/x-icon" />
    <title>SyS Climatización</title>
  </head>
  <body class="flex h-screen flex-col">
    <header class="sticky top-0 z-[999999]">
      <nav class="flex flex-wrap items-center justify-between bg-white p-1 shadow-[0_0_0.5rem_rgba(0,0,0,0.1)]">
        <div class="flex-1 p-1">
          <img src="../assets/img/logo-1.webp" alt="" class="h-12" />
        </div>
        <ul class="flex flex-1 list-none flex-wrap justify-center gap-4 p-0 font-semibold">
          <li><a href="../#inicio">Inicio</a></li>
          <li><a href="../#nosotros">Misión</a></li>
          <li><a href="../#trabajos">Trabajos</a></li>
        </ul>
        <div class="flex-1 p-1 pr-4"></div>
      </nav>
    </header>
    <main class="flex flex-1 items-center justify-center">
      <p id="mensaje"></p>
      <section class="mx-auto mb-4 flex max-w-[1200px] flex-wrap gap-4 px-4">
        <div class="contenedor-informacion">
          <h2>Registro de Administrador</h2>
          <form id="register-form" class="mt-4 flex flex-col gap-2">
            <input
              type="text"
              id="username"
              placeholder="Nombre de usuario"
              class="input-campo"
            />
            <input
              type="email"
              id="email"
              placeholder="Correo electrónico"
              class="input-campo"
            />
            <input
              type="password"
              id="password"
              placeholder="Contraseña"
              class="input-campo"
            />
            <button type="submit" class="btn-enviar">Registrarse</button>
          </form>
        </div>
        <div class="contenedor-informacion">
          <h2>Inicia sesión en SyS Climatización</h2>
          <form id="login-form" class="mt-4 flex flex-col gap-2">
            <input
              type="email"
              id="login-email"
              placeholder="Correo electrónico"
              class="input-campo"
            />
            <input
              type="password"
              id="login-password"
              placeholder="Contraseña"
              class="input-campo"
            />
            <button type="submit" class="btn-enviar">Iniciar sesión</button>
          </form>
        </div>
      </section>
    </main>

    <script src="auth.js" defer></script>
  </body>
</html>
